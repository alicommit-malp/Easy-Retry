name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx" --results-directory TestResults

      - name: Pack
        run: dotnet pack src/EasyRetry/EasyRetry.csproj --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check tag matches PackageVersion
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's|.*<PackageVersion>\(.*\)</PackageVersion>.*|\1|p' src/EasyRetry/EasyRetry.csproj)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match PackageVersion $version in EasyRetry.csproj" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts

      - name: NuGet login (OIDC to short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: AliTabryzy

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
